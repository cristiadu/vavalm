name: Verify workspace
description: Builds, lints and tests the workspace against the Docker stack.

# Local action: the calling job checks the repository out first. A composite
# action cannot read secrets, so the caller passes the key.
inputs:
  rest-countries-api-key:
    description: 'Key the API uses to retrieve countries.'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      with:
        package_json_file: package.json
        run_install: false

    - name: Use Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: '.nvmrc'
        cache: pnpm
        cache-dependency-path: 'pnpm-lock.yaml'

    - name: Install dependencies
      shell: bash
      run: pnpm install

    - name: Build
      shell: bash
      run: pnpm build

    - name: Lint
      shell: bash
      run: pnpm lint

    - name: Create env files
      shell: bash
      run: pnpm create-env-file

    - name: Start Docker stack
      shell: bash
      env:
        REST_COUNTRIES_API_KEY: ${{ inputs.rest-countries-api-key }}
      run: pnpm dev:docker:up

    - name: Test
      shell: bash
      run: pnpm test

    - name: Check for unused code and dependencies
      shell: bash
      run: pnpm knip

    - name: Bundle Docker logs on failure
      if: ${{ failure() }}
      continue-on-error: true
      shell: bash
      run: pnpm dev:docker:logs

    - name: Upload Docker logs artifact on failure
      if: ${{ failure() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: vavalm-docker-logs-${{ github.run_id }}-${{ github.run_attempt }}
        path: artifacts/*.zip
        if-no-files-found: ignore

    # Last, so a failing run still has its container logs bundled above.
    - name: Stop Docker stack
      if: ${{ always() }}
      shell: bash
      run: pnpm dev:docker:down
