name: Build Desktop Apps

on:
  workflow_dispatch:
  release:
    types: [published]
  pull_request:
    paths:
      - 'api/**'
      - 'desktop/**'
      - 'ui/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/desktop.yml'

permissions:
  contents: read

jobs:
  package:
    name: package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact_path: 'desktop/release/*.dmg'
          - os: ubuntu-latest
            artifact_path: |
              desktop/release/*.AppImage
              desktop/release/*.deb
          - os: windows-latest
            artifact_path: 'desktop/release/*.exe'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: package.json
          run_install: false

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify release version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          package_version="$(node -p "require('./desktop/package.json').version")"
          test "$RELEASE_TAG" = "v$package_version"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test desktop runtime
        run: pnpm --filter @cristiadu/vavalm-desktop test

      - name: Build installer
        run: pnpm desktop:dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vavalm-${{ runner.os }}-${{ runner.arch }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

  release:
    name: upload GitHub Release assets
    if: github.event_name == 'release'
    needs: package
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download installers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: vavalm-*
          path: release
          merge-multiple: true

      - name: Upload installers to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" release/* --clobber
