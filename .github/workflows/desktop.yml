name: Build Desktop Apps

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'api/**'
      - 'desktop/**'
      - 'ui/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/actions/**'
      - '.github/workflows/desktop.yml'
      - '.github/workflows/desktop-package.yml'

permissions:
  contents: read

jobs:
  package:
    name: desktop
    uses: ./.github/workflows/desktop-package.yml
    secrets: inherit
