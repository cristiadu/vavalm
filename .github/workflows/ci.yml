name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One run per branch: pushing again cancels the run still in flight, since its
# result is already out of date.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Named "build" because main requires a status check by that name.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/verify-workspace
        with:
          rest-countries-api-key: ${{ secrets.REST_COUNTRIES_API_KEY }}

  desktop:
    name: desktop (${{ matrix.os }})
    # One platform failing should not hide whether the others still build.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/package-desktop
        with:
          rest-countries-api-key: ${{ secrets.REST_COUNTRIES_API_KEY }}
