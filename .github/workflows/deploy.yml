name: Deploy to Test Environment

# Deploys only once the build workflow has gone green on main, so a failing test
# suite can never reach the test environment.
on:
  workflow_run:
    workflows: ["Build and Test Project"]
    branches: [main]
    types: [completed]

permissions:
  contents: read

# Deploys are not interchangeable the way builds are: cancelling one mid-flight
# leaves the environment on a half-applied release, so they queue instead.
concurrency:
  group: deploy-test-env
  cancel-in-progress: false

jobs:
  # The image is built here rather than on the host. Render bills
  # service-initiated fetches, so building there paid for the base image and a
  # full dependency install on every deploy; Actions minutes and bandwidth are
  # free on a public repository. It also means the artifact that ships is the
  # one that was built, not a rebuild that happens to use the same inputs.
  build-image:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.build.outputs.image }}
    steps:
    # workflow_run grants the base repository's token, so check out a trusted
    # ref rather than an event-provided sha.
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: refs/heads/main

    - name: Build and push image
      id: build
      env:
        REGISTRY_USER: ${{ github.repository_owner }}
        REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REPOSITORY: ${{ github.repository }}
      run: |
        # Tag by the commit actually checked out, so the tag names the build's
        # input rather than whatever main pointed at when the job was queued.
        sha="$(git rev-parse HEAD)"
        name="ghcr.io/$(echo "$REPOSITORY" | tr '[:upper:]' '[:lower:]')/api"

        echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin

        docker build -f api/Dockerfile -t "$name:$sha" -t "$name:latest" .
        docker push "$name:$sha"
        docker push "$name:latest"

        echo "image=$name:$sha" >> "$GITHUB_OUTPUT"

  deploy-api:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    needs: build-image
    runs-on: ubuntu-latest
    steps:
    # imgURL points the service at this exact tag. Image-backed services do not
    # redeploy on their own when a tag moves, so the hook is what releases it.
    - name: Trigger Render deploy
      env:
        RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        IMAGE: ${{ needs.build-image.outputs.image }}
      run: |
        # --fail-with-body rather than --fail: on a rejection the status alone
        # does not say whether the service is suspended, still repo-backed, or
        # something else, and the body is where render explains itself.
        curl --get --fail-with-body --silent --show-error \
          "$RENDER_DEPLOY_HOOK_URL" \
          --data-urlencode "imgURL=$IMAGE"

    # The deploy hook returns as soon as the build is queued, and a free instance
    # takes minutes to build and cold-start. The UI build bakes in the API URL,
    # so it must not start until the API is actually serving.
    - name: Wait for API health
      env:
        API_BASE_URL: ${{ vars.API_BASE_URL }}
      run: |
        for attempt in $(seq 1 60); do
          status="$(curl --output /dev/null --silent --write-out '%{http_code}' --max-time 90 "$API_BASE_URL/health" || true)"
          if [ "$status" = "200" ]; then
            echo "API healthy after ${attempt} attempt(s)"
            exit 0
          fi
          # A cold start holds the connection open and reports 000 on timeout; a
          # prompt 503 is the host saying the service is not running at all, and
          # no amount of waiting changes that.
          if [ "$status" = "503" ] && [ "$attempt" -ge 3 ]; then
            echo "API returned 503 on ${attempt} consecutive attempts — the service is not running, not starting"
            exit 1
          fi
          echo "Attempt ${attempt}: API returned ${status}, retrying in 30s"
          sleep 30
        done
        echo "API did not become healthy within 30 minutes"
        exit 1

  deploy-ui:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    needs: deploy-api
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
    # In workflow_run context, avoid checking out event-provided SHAs; deploy only
    # from a trusted branch ref.
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: refs/heads/main

    - name: Install pnpm
      uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      with:
        package_json_file: package.json
        run_install: false
    - name: Use Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: '.nvmrc'
        cache: pnpm
        cache-dependency-path: "pnpm-lock.yaml"

    # The Vercel CLI is pinned so a CLI release cannot change deploy behaviour
    # without a commit here.
    - name: Deploy UI to Vercel
      env:
        VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      run: |
        npx --yes vercel@59.1.3 pull --yes --environment=production --token="$VERCEL_TOKEN"
        npx --yes vercel@59.1.3 build --prod --token="$VERCEL_TOKEN"
        npx --yes vercel@59.1.3 deploy --prebuilt --prod --token="$VERCEL_TOKEN"
