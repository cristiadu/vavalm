name: Deploy to Test Environment

# Deploys only once the build workflow has gone green on main, so a failing test
# suite can never reach the test environment.
on:
  workflow_run:
    workflows: ["Build and Test Project"]
    branches: [main]
    types: [completed]

permissions:
  contents: read

# Deploys are not interchangeable the way builds are: cancelling one mid-flight
# leaves the environment on a half-applied release, so they queue instead.
concurrency:
  group: deploy-test-env
  cancel-in-progress: false

jobs:
  deploy-api:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
    - name: Trigger Render deploy
      env:
        RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      run: curl --fail --silent --show-error "$RENDER_DEPLOY_HOOK_URL"

    # The deploy hook returns as soon as the build is queued, and a free instance
    # takes minutes to build and cold-start. The UI build bakes in the API URL,
    # so it must not start until the API is actually serving.
    - name: Wait for API health
      env:
        API_BASE_URL: ${{ vars.API_BASE_URL }}
      run: |
        for attempt in $(seq 1 60); do
          if curl --fail --silent --max-time 90 "$API_BASE_URL/health"; then
            echo "API healthy after ${attempt} attempt(s)"
            exit 0
          fi
          echo "Attempt ${attempt}: API not healthy yet, retrying in 30s"
          sleep 30
        done
        echo "API did not become healthy within 30 minutes"
        exit 1

  deploy-ui:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    needs: deploy-api
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
    # workflow_run checks out the default branch tip by default, which can have
    # moved past the commit that passed CI.
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.event.workflow_run.head_sha }}

    - name: Install pnpm
      uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      with:
        package_json_file: package.json
        run_install: false
    - name: Use Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: '.nvmrc'
        cache: pnpm
        cache-dependency-path: "pnpm-lock.yaml"

    # The Vercel CLI is pinned so a CLI release cannot change deploy behaviour
    # without a commit here.
    - name: Deploy UI to Vercel
      env:
        VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      run: |
        npx --yes vercel@59.1.3 pull --yes --environment=production --token="$VERCEL_TOKEN"
        npx --yes vercel@59.1.3 build --prod --token="$VERCEL_TOKEN"
        npx --yes vercel@59.1.3 deploy --prebuilt --prod --token="$VERCEL_TOKEN"
