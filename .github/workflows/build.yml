name: Build and Test Project

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

# One run per branch: pushing again cancels the run still in flight, since its
# result is already out of date.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - uses: ./.github/actions/setup-workspace

    - name: Install Projects' Dependencies
      run: |
        pnpm install
        
    - name: Build Projects
      run: |
        pnpm build

    - name: Lint Projects
      run: |
        pnpm lint

    - name: Create env files
      run: |
        pnpm create-env-file

    - name: Start Docker stack
      env:
        REST_COUNTRIES_API_KEY: ${{ secrets.REST_COUNTRIES_API_KEY }}
      run: |
        pnpm dev:docker:up

    - name: Test Projects
      run: |
        pnpm test

    - name: Checking for unused code and dependencies
      run: |
        pnpm knip

    - name: Bundle Docker logs on failure
      if: ${{ failure() }}
      continue-on-error: true
      run: |
        pnpm dev:docker:logs

    - name: Upload Docker logs artifact on failure
      if: ${{ failure() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: vavalm-docker-logs-${{ github.run_id }}-${{ github.run_attempt }}
        path: artifacts/*.zip
        if-no-files-found: ignore

    # Last, so a failing run still has its container logs bundled above.
    - name: Stop Docker stack
      if: ${{ always() }}
      run: |
        pnpm dev:docker:down
