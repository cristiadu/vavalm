name: Package Docker

# Builds the API and UI images, proves the stack they form works, and publishes
# them when the caller asks. Called by CI and CD.
on:
  workflow_call:
    inputs:
      publish:
        description: 'Push the images to the container registry.'
        type: boolean
        required: false
        default: false
    outputs:
      images:
        description: 'The images the run built, one reference per line.'
        value: ${{ jobs.package.outputs.images }}

permissions:
  contents: read

jobs:
  package:
    name: docker
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.images.outputs.references }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: package.json
          run_install: false

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # The registry rejects an owner with capitals, which a repository name is
      # allowed to have.
      - name: Resolve the image names
        id: images
        run: |
          owner="$(echo "${GITHUB_REPOSITORY%%/*}" | tr '[:upper:]' '[:lower:]')"
          version="$(node -p "require('./package.json').version")"
          {
            echo "api=ghcr.io/$owner/vavalm-api"
            echo "ui=ghcr.io/$owner/vavalm-ui"
            echo "tag=$version"
            echo 'references<<REFERENCES'
            echo "ghcr.io/$owner/vavalm-api:$version"
            echo "ghcr.io/$owner/vavalm-ui:$version"
            echo 'REFERENCES'
          } >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Create env files
        run: pnpm create-env-file

      - name: Build images
        env:
          API_IMAGE: ${{ steps.images.outputs.api }}
          UI_IMAGE: ${{ steps.images.outputs.ui }}
          IMAGE_TAG: ${{ steps.images.outputs.tag }}
        run: pnpm docker:build

      - name: Start Docker stack
        env:
          API_IMAGE: ${{ steps.images.outputs.api }}
          UI_IMAGE: ${{ steps.images.outputs.ui }}
          IMAGE_TAG: ${{ steps.images.outputs.tag }}
          REST_COUNTRIES_API_KEY: ${{ secrets.REST_COUNTRIES_API_KEY }}
        run: pnpm dev:docker:up

      - name: Test
        run: pnpm test

      - name: Check for unused code and dependencies
        run: pnpm knip

      - name: Log in to the container registry
        if: inputs.publish
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Published only after the stack built from these images has passed, so a
      # broken image never reaches the registry.
      - name: Publish images
        if: inputs.publish
        env:
          API_IMAGE: ${{ steps.images.outputs.api }}
          UI_IMAGE: ${{ steps.images.outputs.ui }}
          IMAGE_TAG: ${{ steps.images.outputs.tag }}
        run: pnpm docker:push

      - name: Bundle Docker logs on failure
        if: ${{ failure() }}
        continue-on-error: true
        run: pnpm dev:docker:logs

      - name: Upload Docker logs artifact on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vavalm-docker-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/*.zip
          if-no-files-found: ignore

      # Last, so a failing run still has its container logs bundled above.
      - name: Stop Docker stack
        if: ${{ always() }}
        run: pnpm dev:docker:down
