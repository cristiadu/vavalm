name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Releases are cumulative, so a run in flight finishes rather than being
# replaced by the next merge.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/verify-workspace
        with:
          rest-countries-api-key: ${{ secrets.REST_COUNTRIES_API_KEY }}

  desktop:
    name: desktop (${{ matrix.os }})
    # One platform failing should not hide whether the others still build.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/package-desktop
        with:
          rest-countries-api-key: ${{ secrets.REST_COUNTRIES_API_KEY }}

  # Every merge refreshes the release for the version main carries, so its
  # downloads come from the newest commit. A version bump merges like anything
  # else and publishes a new release.
  release:
    name: publish the release
    needs: [build, desktop]
    # Creating a release and uploading assets both need contents: write, which
    # this grants over the read the workflow defaults to.
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download installers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: vavalm-*
          path: release
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v$version"

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Refreshing $tag with the installers from $GITHUB_SHA"
            gh release upload "$tag" release/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            echo "Publishing $tag from $GITHUB_SHA"
            gh release create "$tag" release/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "VaValM $tag" \
              --generate-notes
          fi
