name: Release Desktop App

# Cuts a release from the current main: raises the version, builds the
# installers from the commit carrying it, and publishes the release with those
# installers attached. The build comes from desktop-package.yml, the same
# definition pull request checks run.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version part to raise'
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: read

# Two releases raising the version at once would race for the same number.
concurrency: release-desktop

jobs:
  version:
    name: raise the version
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.raise.outputs.version }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - uses: ./.github/actions/setup-workspace

      # One release covers the whole application, so every package moves to the
      # same version together.
      - name: Raise the application version
        id: raise
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          pnpm version "$BUMP" \
            --workspaces \
            --include-workspace-root \
            --no-git-tag-version \
            --no-workspaces-update

          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Raised every package to $version"

      # The commit is pushed before the build so the installers are built from
      # the version they will be published under. The tag comes later, with the
      # release, so a failed build leaves nothing tagged to clean up.
      - name: Commit the version
        id: commit
        env:
          VERSION: ${{ steps.raise.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am "chore: release v$VERSION"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  package:
    name: build
    needs: version
    uses: ./.github/workflows/desktop-package.yml
    secrets: inherit
    with:
      ref: ${{ needs.version.outputs.sha }}
      expected-version: ${{ needs.version.outputs.version }}

  publish:
    name: publish the release
    needs: [version, package]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download installers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: vavalm-*
          path: release
          merge-multiple: true

      # Creating the release tags the built commit and attaches the installers
      # in one step, so a published release always has something to download.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          SHA: ${{ needs.version.outputs.sha }}
        run: |
          gh release create "v$VERSION" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SHA" \
            --title "VaValM v$VERSION" \
            --generate-notes
