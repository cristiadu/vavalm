name: Release Desktop App

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version part to raise'
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: read

# Concurrent runs would race for the same version.
concurrency: release-desktop

jobs:
  version:
    name: raise the version
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.raise.outputs.version }}
      sha: ${{ steps.merge.outputs.sha }}
    steps:
      # main only takes changes through a reviewed pull request, and a pull
      # request opened with the default token does not start any checks, so the
      # required ones would never report. RELEASE_TOKEN is a personal access
      # token with contents and pull-requests write.
      - name: Require a release token
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo 'RELEASE_TOKEN is not set. See the release section of the README.' >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: package.json
          run_install: false

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Raise the application version
        id: raise
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          # Recursive covers the root manifest too, and skips git entirely.
          pnpm version "$BUMP" --recursive

          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Raised every package to $version"

      - name: Open the version pull request
        id: pull-request
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          VERSION: ${{ steps.raise.outputs.version }}
        run: |
          branch="release/v$VERSION"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$branch"
          git commit -am "chore: release v$VERSION"
          git push origin "$branch"

          gh pr create \
            --base main \
            --head "$branch" \
            --title "chore: release v$VERSION" \
            --body "Raises every package to v$VERSION. Opened by the release workflow; merging it starts the installer build."
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      # Waits for the checks main requires, then merges. Auto-merge is off for
      # this repository, so the merge is made here rather than queued.
      - name: Merge the version pull request
        id: merge
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          BRANCH: ${{ steps.pull-request.outputs.branch }}
        run: |
          for _ in $(seq 1 12); do
            gh pr checks "$BRANCH" --required > /dev/null 2>&1 && break
            sleep 15
          done
          gh pr checks "$BRANCH" --required --watch --fail-fast --interval 20

          # Code scanning reports outside the checks above and can lag behind it.
          for attempt in $(seq 1 10); do
            gh pr merge "$BRANCH" --squash --delete-branch && break
            if [ "$attempt" = 10 ]; then
              echo "Could not merge the version pull request" >&2
              exit 1
            fi
            sleep 20
          done

          echo "sha=$(gh pr view "$BRANCH" --json mergeCommit --jq .mergeCommit.oid)" >> "$GITHUB_OUTPUT"

  package:
    name: build
    needs: version
    uses: ./.github/workflows/desktop-package.yml
    secrets: inherit
    with:
      ref: ${{ needs.version.outputs.sha }}
      expected-version: ${{ needs.version.outputs.version }}

  publish:
    name: publish the release
    needs: [version, package]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download installers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: vavalm-*
          path: release
          merge-multiple: true

      # Tags the merged commit and attaches the installers in one step, so a
      # failed build leaves no tag behind.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          SHA: ${{ needs.version.outputs.sha }}
        run: |
          gh release create "v$VERSION" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SHA" \
            --title "VaValM v$VERSION" \
            --generate-notes
