packages:
  - 'api'
  - 'desktop'
  - 'ui'
allowBuilds:
  '@embedded-postgres/darwin-arm64': true
  '@embedded-postgres/darwin-x64': true
  '@embedded-postgres/linux-arm': true
  '@embedded-postgres/linux-arm64': true
  '@embedded-postgres/linux-ia32': true
  '@embedded-postgres/linux-ppc64': true
  '@embedded-postgres/linux-x64': true
  '@embedded-postgres/windows-x64': true
  '@scarf/scarf': false
  electron-winstaller: true
  sharp: true
# only install package versions published at least 3 days ago (supply-chain protection)
minimumReleaseAge: 4320
# Electron packaging copies the traced Next.js server output as plain files, and
# the Windows installer resolves symlinks into real directories. That detaches a
# linked package from the virtual-store siblings it resolves against, so the
# desktop UI must be linked without symlinks.
nodeLinker: hoisted
